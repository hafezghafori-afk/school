name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  permission-catalog-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check frontend/backend permission catalogs agree
        run: node scripts/checkPermissionCatalogSync.js

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Backend smoke test
        run: npm run test:smoke
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/school_db

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Frontend smoke test
        run: npm run test:smoke

  frontend-e2e-smoke:
    runs-on: ubuntu-latest
    needs:
      - frontend-quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e:smoke

      - name: Run Playwright responsive checks
        run: npm run test:e2e:responsive

      # The responsive check above only visits anonymous routes, because it runs
      # with no backend to sign in against. This one seeds a session and covers
      # what a signed-in phone user actually meets: the shell and its drawer, the
      # card layout the wide tables turn into, every page staying inside the
      # screen with nothing under 44px, and the three non-admin roles.
      #
      # One step, not four: each `npm run test:e2e:*` boots its own dev server,
      # and four extra boots cost about a minute for nothing. The failing test's
      # name still says which invariant broke.
      - name: Run Playwright mobile checks
        run: npm run test:e2e:mobile

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
