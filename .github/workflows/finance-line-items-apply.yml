name: Finance Line Items Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "دقیقاً APPLY_FINANCE_LINE_ITEMS را وارد کنید"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finance-line-items-apply
  cancel-in-progress: false

jobs:
  finance-line-items-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Check MongoDB secret
        shell: bash
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "MONGO_URI secret is missing."
            exit 1
          fi

      - name: Verify confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "APPLY_FINANCE_LINE_ITEMS" ]; then
            echo "Confirmation text is incorrect."
            exit 1
          fi

      - name: Apply finance line item repair
        run: npm run finance:line-items
