name: Finance Line Items Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-line-items-dry:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Check MongoDB secret
        shell: bash
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "MONGO_URI secret is missing."
            exit 1
          fi

      - name: Run finance line items dry run
        run: npm run finance:line-items:dry
